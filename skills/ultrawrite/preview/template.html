<title>__TITLE__</title>
<script type="importmap">{"imports": {"tinybase": "https://cdn.jsdelivr.net/npm/tinybase@10.0.0/+esm"}}</script>
<style>
:root{--bg:#F6F7F4;--surface:#FFFFFF;--ink:#1D2320;--muted:#5E6862;--rule:#D9DED9;--accent:#2F6B4F;--accent-soft:#E4EFE8;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--surface:#1B201D;--ink:#E4E8E5;--muted:#9AA59E;--rule:#2C332F;--accent:#7CC3A0;--accent-soft:#1F2E26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141816;--surface:#1B201D;--ink:#E4E8E5;--muted:#9AA59E;--rule:#2C332F;--accent:#7CC3A0;--accent-soft:#1F2E26;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:24px 48px;margin:0}
main{max-width:980px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px}
@media (max-width:720px){main{grid-template-columns:1fr}}
section{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h1{grid-column:1/-1;margin:0;font-size:1.5rem}
.summary{grid-column:1/-1;color:var(--muted);margin:0;max-width:70ch}
.status-line{grid-column:1/-1;margin:0;font-size:.9rem;color:var(--muted)}
button,select,input{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.story-label{margin:0;font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.story-sentence{margin:0;font-size:1.3rem;line-height:1.4}
.verdict-buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.btn-primary,.btn-secondary{min-height:44px;padding:0 20px;border-radius:6px;font-size:1rem;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff;border:1px solid var(--accent)}
.btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--rule)}
.nav-links{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.nav-links a{color:var(--muted);font-size:.9rem;text-decoration:none}
.nav-links a:hover,.nav-links a:focus-visible{text-decoration:underline}
.prompt{margin:0;font-size:1.05rem;font-weight:600}
.hint{margin:0;color:var(--muted)}
#skip-link{display:inline-block;color:var(--muted);font-size:.95rem}
.picked-note{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.say-more{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
.say-more input{min-height:44px;padding:0 10px;border-radius:6px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
#send-btn:disabled{opacity:.5;cursor:not-allowed}
.finished-msg{margin:0;font-size:1.1rem}
#summary-list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
#app.picking [data-mark]{cursor:pointer}
#app.picking [data-mark]:hover,#app.picking [data-mark]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<main>
  <h1 id="title"></h1>
  <p class="summary" id="summary"></p>
  <p class="status-line" id="progress"></p>
  <p class="status-line" id="save-note"></p>
  <section id="card"><div id="card-body"></div></section>
  <section>
    <div id="app" data-mark="app"></div>
  </section>
</main>
<script type="module">
import * as TB from 'tinybase'
const PAGE = __PAGE_JSON__
const storeMod = __STORE_MODULE__
const sketchMod = __SKETCH_MODULE__

const store = storeMod.makeStore()
const TOOLS = Object.fromEntries(storeMod.TOOLS.map((t) => [t.name, t]))
const clone = (x) => JSON.parse(JSON.stringify(x))
let db = null
const unsaved = []
let session = Math.random().toString(36).slice(2, 10)

const CHIP_LABEL = { wrong: 'Wrong', missing: 'Missing something', confusing: 'Confusing word' }

let storyIndex = 0
let story = PAGE.stories.length ? PAGE.stories[0].id : 'S1'
let step = 0
const verdicts = {} // storyId -> { mark, part, note }
let walkStep = 'verdict' // 'verdict' | 'pick-part' | 'detail'
let pendingPart = null
let selectedChip = null
let pickClickHandler = null
let pickKeyHandler = null
const addedTabIndex = []

function sanitizeId (s) {
  return s.replace(/[^A-Za-z0-9_.~:@+-]/g, '_')
}

async function save (collection, id, doc, { pendingNote, onOk, onFail } = {}) {
  if (!db) { unsaved.push({ collection, id, doc, pendingNote, onOk, onFail }); return false }
  try {
    await db.collection(collection).doc(id).set(doc)
    document.getElementById('save-note').textContent = pendingNote || 'Saved'
    onOk?.()
    retryUnsaved()
    return true
  } catch (err) {
    unsaved.push({ collection, id, doc, pendingNote, onOk, onFail })
    const msg = (err && (err.message || err.code)) || String(err)
    document.getElementById('save-note').textContent = `Not saved: ${msg} — tell Claude`
    onFail?.(msg)
    return false
  }
}
async function retryUnsaved () {
  if (!db) return
  for (const item of unsaved.splice(0)) {
    await save(item.collection, item.id, item.doc, { pendingNote: item.pendingNote, onOk: item.onOk, onFail: item.onFail })
  }
}
function call (name, args = {}, ui = null) {
  const tool = TOOLS[name]
  if (!tool) throw new Error('no tool ' + name)
  const before = clone(store.getContent())
  tool.run(store, args)
  const after = clone(store.getContent())
  step += 1
  const row = { session, at: Date.now(), story, step, piece: tool.piece, tool: name, args: clone(args),
    layer: ui ? 'ui' : 'store', ui: ui ? clone(ui) : null, before, after, see: [] }
  save('steps', `${session}-${story}-${step}`, row, { pendingNote: `Saved step ${step}` })
}
function restart () {
  store.setContent([{}, {}])
  session = Math.random().toString(36).slice(2, 10)
  step = 0
}

function checkedCount () { return PAGE.stories.filter((s) => verdicts[s.id]).length }
function allChecked () { return PAGE.stories.length > 0 && checkedCount() === PAGE.stories.length }
function renderProgress () {
  document.getElementById('progress').textContent = `${checkedCount()} of ${PAGE.stories.length} stories checked`
}

function deactivatePicking () {
  const app = document.getElementById('app')
  app.classList.remove('picking')
  if (pickClickHandler) app.removeEventListener('click', pickClickHandler, true)
  if (pickKeyHandler) app.removeEventListener('keydown', pickKeyHandler, true)
  pickClickHandler = null
  pickKeyHandler = null
  for (const el of addedTabIndex.splice(0)) el.removeAttribute('tabindex')
}
function activatePicking () {
  const app = document.getElementById('app')
  app.classList.add('picking')
  for (const el of app.querySelectorAll('[data-mark]')) {
    if (!el.hasAttribute('tabindex')) { el.setAttribute('tabindex', '0'); addedTabIndex.push(el) }
  }
  const choose = (e) => {
    const el = e.target.closest('[data-mark]')
    if (!el) return
    e.preventDefault()
    e.stopPropagation()
    const part = el.dataset.mark === 'app' ? null : el.dataset.mark
    onPartChosen(part)
  }
  pickClickHandler = choose
  pickKeyHandler = (e) => { if (e.key === 'Enter' || e.key === ' ') choose(e) }
  app.addEventListener('click', pickClickHandler, true)
  app.addEventListener('keydown', pickKeyHandler, true)
}

function goToStory (idx) {
  deactivatePicking()
  storyIndex = idx
  story = PAGE.stories[idx].id
  walkStep = 'verdict'
  pendingPart = null
  selectedChip = null
  restart()
  renderCard()
  renderProgress()
}

function advanceAfterVerdict () {
  renderProgress()
  if (allChecked()) { renderCard(); return }
  const n = PAGE.stories.length
  for (let i = 1; i <= n; i++) {
    const idx = (storyIndex + i) % n
    if (!verdicts[PAGE.stories[idx].id]) { goToStory(idx); return }
  }
  renderCard()
}

function recordMark (mark, part, noteVal) {
  const at = Date.now()
  const target = part ? `story:${story}/${part}` : `story:${story}`
  const rawId = part ? `${at}-${story}-${part}` : `${at}-${story}`
  const id = sanitizeId(rawId)
  save('marks', id, { target, mark, note: noteVal, at }, { pendingNote: 'Saved your answer' })
  verdicts[story] = { mark, part, note: noteVal }
  advanceAfterVerdict()
}

function onYes () { recordMark('yes', null, '') }
function onNotQuite () {
  walkStep = 'pick-part'
  pendingPart = null
  renderCard()
  activatePicking()
}
function onPartChosen (part) {
  pendingPart = part
  selectedChip = null
  walkStep = 'detail'
  deactivatePicking()
  renderCard()
}
function onNav (delta) {
  const next = storyIndex + delta
  if (next < 0 || next >= PAGE.stories.length) return
  goToStory(next)
}
function onChipSelect (chip, el) {
  selectedChip = chip
  for (const b of el.parentElement.querySelectorAll('.chip')) b.setAttribute('aria-pressed', String(b === el))
  const send = document.getElementById('send-btn')
  if (send) send.disabled = false
}
function onSend () {
  if (!selectedChip) return
  const noteEl = document.getElementById('say-more')
  recordMark(selectedChip, pendingPart, noteEl ? noteEl.value : '')
}

function verdictSummary (v) {
  if (v.mark === 'yes') return 'Yes'
  let s = `Not quite: ${CHIP_LABEL[v.mark] || v.mark}`
  if (v.part) s += ` — ${v.part}`
  if (v.note) s += ` — "${v.note}"`
  return s
}

function renderCard () {
  const body = document.getElementById('card-body')
  body.replaceChildren()
  if (allChecked()) {
    const label = document.createElement('p')
    label.className = 'story-label'
    label.textContent = 'All done'
    const msg = document.createElement('p')
    msg.className = 'finished-msg'
    msg.textContent = `All ${PAGE.stories.length} stories checked. Tell Claude you're done.`
    const list = document.createElement('ul')
    list.id = 'summary-list'
    for (const s of PAGE.stories) {
      const li = document.createElement('li')
      const v = verdicts[s.id]
      li.textContent = `${s.sentence} — ${v ? verdictSummary(v) : 'not checked'}`
      list.append(li)
    }
    body.append(label, msg, list)
    return
  }
  const s = PAGE.stories[storyIndex]
  const label = document.createElement('p')
  label.className = 'story-label'
  label.textContent = `Story ${storyIndex + 1} of ${PAGE.stories.length}`
  const sentence = document.createElement('p')
  sentence.className = 'story-sentence'
  sentence.textContent = s ? s.sentence : ''
  body.append(label, sentence)

  if (walkStep === 'verdict') {
    const buttons = document.createElement('div')
    buttons.className = 'verdict-buttons'
    const yes = document.createElement('button')
    yes.type = 'button'
    yes.id = 'yes-btn'
    yes.className = 'btn-primary'
    yes.textContent = 'Yes, it works like this'
    const not = document.createElement('button')
    not.type = 'button'
    not.id = 'not-quite-btn'
    not.className = 'btn-secondary'
    not.textContent = 'Not quite'
    buttons.append(yes, not)
    body.append(buttons)
    const nav = document.createElement('div')
    nav.className = 'nav-links'
    const prev = document.createElement('a')
    prev.href = '#'
    prev.id = 'prev-link'
    prev.textContent = '← Previous story'
    const next = document.createElement('a')
    next.href = '#'
    next.id = 'next-link'
    next.textContent = 'Next story →'
    if (storyIndex === 0) prev.style.visibility = 'hidden'
    if (storyIndex === PAGE.stories.length - 1) next.style.visibility = 'hidden'
    nav.append(prev, next)
    body.append(nav)
  } else if (walkStep === 'pick-part') {
    const prompt = document.createElement('p')
    prompt.className = 'prompt'
    prompt.textContent = "Tap the part that's off"
    const hint = document.createElement('p')
    hint.className = 'hint'
    hint.textContent = "Tap the part of the app on the right that isn't right."
    const skip = document.createElement('a')
    skip.href = '#'
    skip.id = 'skip-link'
    skip.textContent = "Skip — it's the whole story"
    body.append(prompt, hint, skip)
  } else if (walkStep === 'detail') {
    const picked = document.createElement('p')
    picked.className = 'picked-note'
    picked.textContent = pendingPart ? `About: ${pendingPart}` : 'About: the whole story'
    const chips = document.createElement('div')
    chips.className = 'chips'
    chips.setAttribute('role', 'group')
    chips.setAttribute('aria-label', "What's wrong")
    for (const [chip, chipLabel] of Object.entries(CHIP_LABEL)) {
      const b = document.createElement('button')
      b.type = 'button'
      b.className = 'chip'
      b.dataset.chip = chip
      b.textContent = chipLabel
      b.setAttribute('aria-pressed', 'false')
      chips.append(b)
    }
    const sayMore = document.createElement('label')
    sayMore.className = 'say-more'
    sayMore.textContent = 'Say more (optional)'
    const input = document.createElement('input')
    input.type = 'text'
    input.id = 'say-more'
    sayMore.append(input)
    const send = document.createElement('button')
    send.type = 'button'
    send.id = 'send-btn'
    send.className = 'btn-primary'
    send.textContent = 'Send'
    send.disabled = true
    body.append(picked, chips, sayMore, send)
  }
}

document.getElementById('card').addEventListener('click', (e) => {
  const t = e.target
  if (t.id === 'yes-btn') { onYes() } else if (t.id === 'not-quite-btn') { onNotQuite() } else if (t.id === 'skip-link') { e.preventDefault(); onPartChosen(null) } else if (t.id === 'prev-link') { e.preventDefault(); onNav(-1) } else if (t.id === 'next-link') { e.preventDefault(); onNav(1) } else if (t.classList.contains('chip')) { onChipSelect(t.dataset.chip, t) } else if (t.id === 'send-btn') { onSend() }
})

document.getElementById('title').textContent = PAGE.title
document.getElementById('summary').textContent = PAGE.summary.join(' ')
const app = document.getElementById('app')
sketchMod.render(app, store, call)
renderProgress()
renderCard()
document.getElementById('save-note').textContent = 'This view cannot save; your steps stay on this page only.'
window.claude?.use?.('db').then((x) => {
  db = x
  if (db) document.getElementById('save-note').textContent = 'Ready — your answers are saved as you go'
  retryUnsaved()
})
</script>
