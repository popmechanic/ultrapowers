[pytest]
# Scope the bare `pytest` (no args) invocation to tests/. Without this, collection
# from the repo root recurses into evals/fixtures/*/project/ — intentionally-broken
# sample projects (missing deps, duplicate test basenames) kept as test data for the
# compiler/seal tests — which abort collection with errors unrelated to the codebase.
testpaths = tests
# `-n auto` by default: the suite is 48 engine sims that each build a real git
# repository and drive the engine end to end, so it is wall-clock bound by work
# rather than by collection — 8 min 13 s serially against 2 min 0 s across 12
# cores, measured 2026-09-17 (#1120). Two tests read machine-global state and
# say in their own comments why they narrow under a worker; everything else is
# already isolated per test. Run one file or one test with `-n0` when a
# failure's output is easier to read serially.
addopts = -n auto
