[pytest]
# Scope the bare `pytest` (no args) invocation to tests/, so collection never wanders
# into fixture trees (evals/fixtures/, the TinyApp template) that are data, not tests.
testpaths = tests
# `-n auto` by default: the suite's fleet sims each build a real git repository and
# drive a launcher or the engine end to end, so it is wall-clock bound by work rather
# than by collection (8 min 13 s serially against 2 min 0 s across 12 cores, measured
# 2026-09-17, #1120). Two tests read machine-global state and
# say in their own comments why they narrow under a worker; everything else is
# already isolated per test. Run one file or one test with `-n0` when a
# failure's output is easier to read serially.
addopts = -n auto
