name: CI

on:
  pull_request:
  push:
    branches: [main]

# A push sequence on one PR branch runs once, not once per commit; main's runs
# are never cancelled, since each is the record of a landed commit (#641).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth stays DEFAULT (1). The shallow clone is deliberate: it is the
      # real consumer shape #465's depth-1 gate leg exists to predict. Setting
      # fetch-depth: 0 would make CI and the gate agree by making CI stop testing
      # the case that broke main.
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The versions the fleet runs (#641): the sandbox installs the Node
          # tarball fleet/setup-script.mjs pins (NODE_VERSION) and exeuntu's
          # python3, so the sims are judged here under the same major lines.
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pytest
        run: python -m pip install --quiet pytest pytest-xdist

      # Every shipped skill, derived from the tree rather than typed: a fifth
      # skill directory is validated the day it appears (#641).
      - name: Validate every skill
        run: |
          for s in skills/*/; do
            python skills/ultrapowers/scripts/validate_skill.py "${s%/}" || exit 1
          done

      # Reported, never gated (#492). The word CEILINGS these numbers used to
      # feed are deleted: a cap on a stored file measures storage, not
      # attention, and one at a single word of headroom made an implementer
      # delete a normative rule to pay it. Accretion stays visible here and in
      # release commit bodies; what is gone is the assert that could hand a
      # worker an impossible budget. #496 (closed 2026-09-01) deleted the last
      # refusing ceiling — fleet/roles/*.md now report here too; nothing gates.
      - name: Report skill prose sizes
        run: wc -w skills/*/SKILL.md fleet/roles/*.md 2>/dev/null || true

      # Reported beside the prose sizes, and for the same reason: a number that
      # moves is worth seeing in the log without opening the run. The count is
      # the suite's own size; --durations=10 below is where the wall goes.
      - name: Report collected test count
        run: python -m pytest tests/ --collect-only -q | tail -n 1

      - name: Run tests
        run: python -m pytest tests/ -n auto -v --durations=10
