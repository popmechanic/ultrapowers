name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth stays DEFAULT (1). The shallow clone is deliberate: it is the
      # real consumer shape #465's depth-1 gate leg exists to predict. Setting
      # fetch-depth: 0 would make CI and the gate agree by making CI stop testing
      # the case that broke main.
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pytest
        run: python -m pip install --quiet pytest pytest-xdist

      - name: Validate skill
        run: python skills/ultrapowers/scripts/validate_skill.py skills/ultrapowers

      - name: Validate ultraplan skill
        run: python skills/ultrapowers/scripts/validate_skill.py skills/ultraplan

      - name: Validate ultralearn skill
        run: python skills/ultrapowers/scripts/validate_skill.py skills/ultralearn

      - name: Validate ultradocket skill
        run: python skills/ultrapowers/scripts/validate_skill.py skills/ultradocket

      - name: Run tests
        run: python -m pytest tests/ -n auto -v
